[package]
name = "rusttoolz"
version = "0.2.0"
edition = "2021"
description = "Lars Rocha's sitoolz in Rust: the prime net, the Pocklington ladder, the twin forge, and the XOR difference triangle."
license = "MIT"
repository = "https://github.com/oppressionslayer/rusttoolz"
readme = "README.md"
keywords = ["primes", "pocklington", "twin-primes", "sieve", "xor"]
categories = ["mathematics", "algorithms"]
# the studios' 700 KB reference file stays in the repo and out of the crate; its test skips without it
exclude = ["tests/data/"]

[dependencies]
num-bigint = "0.4"
num-integer = "0.1"
num-traits = "0.2"
rayon = "1.10"
# GMP, opt-in for native builds only: `--features gmp`. The default stays pure Rust so the crate
# compiles to wasm; with the feature every modular exponentiation goes through GMP.
rug = { version = "1.24", optional = true, default-features = false, features = ["integer", "std"] }

[features]
default = []
gmp = ["dep:rug"]

[dev-dependencies]
# only the tests read JSON: the reference cases the Spindexin studios generate from sitoolz
serde_json = { version = "1", features = ["float_roundtrip"] }

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
